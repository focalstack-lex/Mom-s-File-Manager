name: Verify

# The authority for every gate. Local runs are advisory; this one blocks.
# Frontend feedback is fast on Linux. The native crate runs on Windows
# because the sorter, the Recycle Bin and the clipboard are Windows-specific.
# Actions are pinned to the commit their tag named on 2026-10-17 (audit T-60);
# Dependabot (.github/dependabot.yml) proposes the updates. The weekly run
# catches a new advisory in a dependency even when nothing was pushed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, invariants, tests, contrast, release checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:text
      - run: npm test
      - run: npm run verify:contrast
      # The release preflight and the notices rule (scripts/release-checks.test.mjs).
      - run: node --test scripts/release-checks.test.mjs

  server:
    name: Ask proxy (server tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      # server/ has no dependencies, so there is nothing to install or audit.
      - run: npm test
        working-directory: server

  advisories:
    name: Advisories (npm audit, cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: npm audit
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Reads Cargo.lock only (every platform's crates); warnings such as an
      # unmaintained crate are printed, a vulnerability fails the job.
      - run: cargo audit
        working-directory: src-tauri

  ui:
    name: UI drive (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-verification
          path: reports/ui-verification

  native:
    name: Native crate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # THIRD-PARTY-NOTICES.txt is generated by scripts/release.mjs and kept out
      # of git, but tauri.conf.json bundles it and tauri-build refuses to build
      # without it. The tests never read it, so a placeholder is enough here.
      - run: Set-Content -Path THIRD-PARTY-NOTICES.txt -Value "Generated at release time by scripts/release.mjs."
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # The release configuration the installer ships: dist/ embedded through
      # custom-protocol, as tauri build compiles it for npm run release. The
      # installer itself is not made here.
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --features tauri/custom-protocol
        working-directory: src-tauri
