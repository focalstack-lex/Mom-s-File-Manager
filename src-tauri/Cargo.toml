[package]
name = "tote"
version = "0.3.0"
description = "Tote: finds a teacher's files and keeps new downloads filed"
authors = ["Lex Matondo"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "tote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shell and plugins. The tray icon keeps the app alive when the window is closed.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Native folder and file pickers for Settings (folders to look in, templates).
tauri-plugin-dialog = "2"
# IPC serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# App data: SQLite with FTS5 compiled in, so no system library is required.
rusqlite = { version = "0.40", features = ["bundled"] }
# Error enum derivation and the logging facade.
thiserror = "2"
log = "0.4"
# The known folders (Desktop, Documents, Downloads).
dirs = "7"
# Folder change events, debounced, for the Downloads watcher and the index.
notify-debouncer-mini = "0.7"
# Office files are zip archives of XML; text is pulled from the XML parts.
zip = { version = "9", default-features = false, features = ["deflate"] }
# PDF text extraction.
pdf-extract = "0.12"
# Recycle Bin instead of permanent deletion.
trash = "5"
# Local dates for the YYYY-MM folders and relative times.
chrono = "0.4"
# Signed self-update (added 2026-10-14 at Lex's request): once a day, at most,
# reads codewithlex.site/tote/latest.json; installs only a package signed with
# the private key kept outside the repo. Pinned to the minor version because
# the updater's HTTP client can change between minor releases.
tauri-plugin-updater = "2.13"

[target.'cfg(windows)'.dependencies]
# Files on the clipboard as files (CF_HDROP), so she can paste into Messenger or Gmail.
clipboard-win = "5"
# GetDriveType through a safe wrapper (this crate denies unsafe code): the
# Recycle Bin exists only on a fixed drive, so a file elsewhere is refused
# instead of being deleted for good (audit T-01, 2026-10-16). Kernel part only.
winsafe = { version = "0.0.24", default-features = false, features = ["kernel"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Our own code must never panic; panics from third-party readers are caught.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: third-party file readers panic on some malformed files,
# and extract.rs catches those panics so one bad file costs its content index,
# not the whole app. With abort, a single scanned PDF crashed Tote on every
# start (2026-10-12). lib.rs refuses to compile with panic = "abort".
panic = "unwind"
strip = true
